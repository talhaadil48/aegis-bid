services:
  postgres:
    image: postgres:18
    command: [postgres, -c, jit=off]
    environment:
      POSTGRES_DB: aegisbid
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegisbid"]
      interval: 3s
      retries: 20
  nats1:
    image: nats:2.11
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:${NATS_PORT:-54222}:4222"]
    volumes: ["nats-data:/data"]
  migrate:
    build: {context: .., dockerfile: infra/Dockerfile}
    command: ["python", "-m", "aegis.db"]
    environment: &app-env
      DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegisbid
      NATS_URL: nats://nats1:4222
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      ENVIRONMENT: development
      ENABLE_CHAOS: ${ENABLE_CHAOS:-false}
      ADMISSION_SERVICE_KEY: ${ADMISSION_SERVICE_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: .., dockerfile: infra/Dockerfile}
    environment:
      <<: *app-env
      ADMIN_SETUP_KEY: ${ADMIN_SETUP_KEY:-}
    ports: ["127.0.0.1:58000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build: {context: .., dockerfile: infra/Dockerfile}
    environment: *app-env
    command: ["python", "-m", "aegis.pipeline", "worker"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats1: {condition: service_started}
  relay:
    build: {context: .., dockerfile: infra/Dockerfile}
    environment: *app-env
    command: ["python", "-m", "aegis.pipeline", "relay"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats1: {condition: service_started}
  web:
    build: {context: .., dockerfile: infra/Web.Dockerfile}
    ports: ["127.0.0.1:${WEB_PORT:-18080}:80"]
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ["127.0.0.1:59090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    profiles: [monitoring]
  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:53000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-local-change-before-use}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    profiles: [monitoring]
volumes:
  postgres-data:
  nats-data:
  prometheus-data:
  grafana-data:
