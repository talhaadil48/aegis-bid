Storage {
  Name = aegis-sd
  SDPort = 9103
  WorkingDirectory = /var/lib/bacula
  PidDirectory = /run/bacula
  Maximum Concurrent Jobs = 2
}
Director {
  Name = aegis-dir
  Password = "__SECRET__"
}
Device {
  Name = AegisVolume
  Media Type = File
  Archive Device = /volumes
  LabelMedia = yes
  Random Access = yes
  AutomaticMount = yes
  RemovableMedia = no
  AlwaysOpen = no
}
Messages {
  Name = Standard
  director = aegis-dir = all
}
