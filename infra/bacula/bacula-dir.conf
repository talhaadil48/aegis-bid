Director {
  Name = aegis-dir
  DIRport = 9101
  QueryFile = "/etc/bacula/scripts/query.sql"
  WorkingDirectory = "/var/lib/bacula"
  PidDirectory = "/run/bacula"
  Maximum Concurrent Jobs = 2
  Password = "__SECRET__"
  Messages = Standard
}
Catalog {
  Name = AegisCatalog
  dbname = bacula
  dbuser = bacula
  dbpassword = "__SECRET__"
  dbaddress = "127.0.0.1"
}
Client {
  Name = aegis-fd
  Address = 127.0.0.1
  FDPort = 9102
  Catalog = AegisCatalog
  Password = "__SECRET__"
  File Retention = 30 days
  Job Retention = 90 days
  AutoPrune = yes
}
Storage {
  Name = AegisDisk
  Address = 127.0.0.1
  SDPort = 9103
  Password = "__SECRET__"
  Device = AegisVolume
  Media Type = File
}
FileSet {
  Name = AegisArtifacts
  Include {
    Options { Signature = SHA256 }
    File = /staging
  }
}
Pool {
  Name = AegisPool
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 30 days
  Maximum Volume Bytes = 2G
  Maximum Volumes = 30
  Label Format = "Aegis-"
}
Schedule {
  Name = AegisSchedule
  Run = Full sun at 02:00
  Run = Incremental mon-sat at 02:00
}
Job {
  Name = AegisBidBackup
  Type = Backup
  Level = Full
  Client = aegis-fd
  FileSet = AegisArtifacts
  Storage = AegisDisk
  Pool = AegisPool
  Schedule = AegisSchedule
  Messages = Standard
}
Job {
  Name = AegisBidRestore
  Type = Restore
  Client = aegis-fd
  FileSet = AegisArtifacts
  Storage = AegisDisk
  Pool = AegisPool
  Messages = Standard
  Where = /restore
}
Messages {
  Name = Standard
  console = all, !skipped, !saved
  append = "/var/log/bacula/aegis.log" = all, !skipped
}
