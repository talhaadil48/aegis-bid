services:
  admission:
    build: {context: .., dockerfile: infra/Realtime.Dockerfile}
    environment:
      API_URL: http://api:8000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:18080}
      ADMISSION_SERVICE_KEY: ${ADMISSION_SERVICE_KEY:?Set a shared 32-character admission service key}
      GOMAXPROCS: '2'
      GOMEMLIMIT: 384MiB
    mem_limit: 512m
    ulimits:
      nofile: {soft: 100000, hard: 100000}
    sysctls:
      net.core.somaxconn: '65535'
    restart: unless-stopped
    depends_on: [api]
  gateway:
    build: {context: .., dockerfile: infra/Realtime.Dockerfile}
    environment:
      API_URL: http://api:8000
      MAX_CONNECTIONS: '60000'
      MAX_AUCTION_CONNECTIONS: '60000'
      MAX_USER_CONNECTIONS: ${MAX_USER_CONNECTIONS:-10}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:18080}
      ADMISSION_SERVICE_KEY: ${ADMISSION_SERVICE_KEY:?Set a shared 32-character admission service key}
      SNAPSHOT_INTERVAL_MS: '2000'
    ports: ["127.0.0.1:18081:8081"]
    ulimits:
      nofile: {soft: 200000, hard: 200000}
    sysctls:
      net.core.somaxconn: '65535'
    restart: unless-stopped
    depends_on: [api]
  web:
    volumes: ["./nginx.scale.conf:/etc/nginx/nginx.conf:ro"]
