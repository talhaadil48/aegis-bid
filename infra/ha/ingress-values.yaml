# Values for ingress-nginx on a real three-zone cluster; use your provider's LB annotations.
controller:
  replicaCount: 3
  minAvailable: 2
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 3
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: controller
