apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: independent-vault
  namespace: aegis
spec:
  configuration:
    destinationPath: s3://REPLACE_INDEPENDENT_BUCKET/postgres/
    s3Credentials:
      accessKeyId: {name: aegis-backup-writer, key: ACCESS_KEY_ID}
      secretAccessKey: {name: aegis-backup-writer, key: ACCESS_SECRET_KEY}
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: aegis-daily-physical
  namespace: aegis
spec:
  schedule: '0 0 2 * * *'
  backupOwnerReference: self
  immediate: true
  cluster: {name: aegis-pg}
  method: plugin
  pluginConfiguration: {name: barman-cloud.cloudnative-pg.io}
