name: Close-window bidding and crash
on:
  workflow_dispatch:
  push:
    paths: ['aegis/**', 'scripts/bid_stress.py', 'scripts/verify_bid_stress.py', 'services/realtime/**', 'infra/compose.stress.yaml', 'infra/Realtime.Dockerfile', '.github/workflows/bid-stress.yml']
jobs:
  failure-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python -m scripts.bid_stress --bidders 500 --shards 1 --workers 3 --fault worker
      - run: python -m scripts.verify_bid_stress $(ls -dt docs/evidence/bids-* | head -1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bidding-crash-evidence
          path: docs/evidence/bids-*/
