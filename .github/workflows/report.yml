name: Submission documents
on: [push, pull_request]
jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-report.lock
      - run: python -m scripts.build_report
      - run: python -m scripts.build_demo_guide
      - uses: actions/upload-artifact@v4
        with:
          name: aegisbid-submission
          path: docs/submission/
