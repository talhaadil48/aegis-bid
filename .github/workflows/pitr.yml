name: Physical PITR rehearsal
on:
  push:
    paths: ['infra/pitr/**', 'infra/compose.pitr.yaml', 'scripts/rehearse_pitr.py', '.github/workflows/pitr.yml']
  workflow_dispatch:
jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: disposable-pitr-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python -c "import os,pathlib; pathlib.Path('.env').write_text('POSTGRES_PASSWORD='+os.environ['POSTGRES_PASSWORD']+'\n')"
      - run: python -m scripts.rehearse_pitr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pitr-recovery-evidence
          path: docs/evidence/pitr-local.json
