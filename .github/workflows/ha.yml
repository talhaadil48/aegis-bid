name: Synchronous PostgreSQL failover
on:
  push:
    paths: ['infra/ha/**', 'scripts/*ha*.py', '.github/workflows/ha.yml']
  workflow_dispatch:
jobs:
  node-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: pip install cfn-lint==1.61.0
      - run: cfn-lint infra/ha/eks.cloudformation.json infra/offsite/bucket.cloudformation.json
      - run: python -m scripts.install_ha_tools
      - run: .tools/kind create cluster --name aegis-ha-lab --config infra/ha/kind.yaml --kubeconfig .tools/ha-kubeconfig --wait 180s
      - run: .tools/kubectl --kubeconfig .tools/ha-kubeconfig apply --server-side -f https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.1/cnpg-1.30.1.yaml
      - run: .tools/kubectl --kubeconfig .tools/ha-kubeconfig -n cnpg-system rollout status deployment/cnpg-controller-manager --timeout=180s
      - run: .tools/kubectl --kubeconfig .tools/ha-kubeconfig -n cnpg-system patch deployment cnpg-controller-manager --type merge --patch-file infra/ha/operator-ha-patch.yaml
      - run: .tools/kubectl --kubeconfig .tools/ha-kubeconfig apply -f infra/ha/postgres.yaml
      - run: python -m scripts.rehearse_ha --kubectl .tools/kubectl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha-ledger-failover-evidence
          path: docs/evidence/ha-local.json
